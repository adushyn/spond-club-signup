<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 44" fill="none">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A6B"/>
      <stop offset="100%" stop-color="#FF4D4F"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="22" cy="22" r="22" fill="url(#sg)"/>

  <!-- Letter S in white -->
  <text x="22" y="29"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="900"
    fill="white"
    letter-spacing="-1">S</text>

  <!-- Wordmark -->
  <text x="56" y="29"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="20"
