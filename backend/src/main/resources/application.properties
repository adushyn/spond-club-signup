spring.application.name=spond-club-signup

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}

turnstile.secret=${CF_TURNSTILE_SECRET:}
turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify

# CORS — set ALLOWED_ORIGINS in Render env vars to your Vercel URL
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
