# ── Test datasource — H2 in-memory ───────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema — skip Flyway (Flyway migration uses pg-specific DDL)
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Suppress H2 banner
spring.h2.console.enabled=false

# Turnstile — disabled in tests (blank secret = skip verification)
turnstile.secret=
turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
